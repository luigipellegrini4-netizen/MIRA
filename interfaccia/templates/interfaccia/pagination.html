<div class="pagination"><span>{{ page.paginator.count }} risultati · Pagina {{ page.number }} di {{ page.paginator.num_pages }}</span><div>{% if page.has_previous %}<a class="button secondary" href="?q={{ q|urlencode }}&stato={{ state|urlencode }}&pagina={{ page.previous_page_number }}">← Precedente</a>{% endif %}{% if page.has_next %}<a class="button secondary" href="?q={{ q|urlencode }}&stato={{ state|urlencode }}&pagina={{ page.next_page_number }}">Successiva →</a>{% endif %}</div></div>
